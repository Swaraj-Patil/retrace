[project]
name = "retrace-workspace"
version = "0.0.1"
description = "RAG-native observability for LLM applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "retrace-api",
    "retrace-sdk",
]

[tool.uv.sources]
retrace-api = { workspace = true }
retrace-sdk = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "packages/sdk-python"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "packages/sdk-python/tests"]
