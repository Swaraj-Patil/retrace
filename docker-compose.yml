services:
  postgres:
    image: postgres:16-alpine
    container_name: retrace-postgres
    environment:
      POSTGRES_USER: retrace
      POSTGRES_PASSWORD: retrace_dev
      POSTGRES_DB: retrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: retrace-clickhouse
    environment:
      CLICKHOUSE_DB: retrace
      CLICKHOUSE_USER: retrace
      CLICKHOUSE_PASSWORD: retrace_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  clickhouse_data:
